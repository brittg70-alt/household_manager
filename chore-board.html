<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>House Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDE6D6; --card: #FBF8F0; --ink: #2B2E26; --ink-soft: #5C6156;
    --forest: #3F5A44; --forest-tint: #E3E9E1;
    --brick: #A8452E; --brick-tint: #F3E1DA;
    --gold: #C0902F; --gold-tint: #F4E9D3;
    --line: #DCD3BE;
    --sarah: #3B6EA5; --sarah-tint: #DDE6EF;
    --britt: #4B7A4F; --britt-tint: #E1E9DE;
    --unassigned: #6B4E9E; --unassigned-tint: #E6E0EF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--paper); color: var(--ink);
    font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh;
    background-image: radial-gradient(circle at 1px 1px, rgba(43,46,38,0.05) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }
  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--ink); padding-bottom: 14px; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
  .header-left { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px; margin: 0; letter-spacing: -0.01em; }
  .datebox { text-align: right; font-family: 'IBM Plex Mono', monospace; color: var(--ink-soft); font-size: 13px; line-height: 1.5; }
  .summary { display: flex; gap: 10px; margin-bottom: 26px; flex-wrap: wrap; }
  .pill { font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--ink); display: flex; gap: 6px; align-items: center; }
  .pill b { font-size: 14px; }
  .pill.overdue { background: var(--brick-tint); border-color: var(--brick); color: var(--brick); }
  .pill.soon { background: var(--gold-tint); border-color: var(--gold); color: #8a6a1f; }
  .pill.ontrack { background: var(--forest-tint); border-color: var(--forest); color: var(--forest); }
  .section-label { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; margin: 30px 0 12px; display: flex; align-items: center; gap: 10px; }
  .section-label .dash { flex: 1; height: 1px; background: var(--line); }
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1.5px solid var(--ink); border-radius: 10px; padding: 16px; position: relative; box-shadow: 3px 3px 0 rgba(43,46,38,0.08); }
  .card.overdue { border-left: 6px solid var(--brick); }
  .card.soon { border-left: 6px solid var(--gold); }
  .card.ontrack { border-left: 6px solid var(--forest); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .chore-name { font-weight: 600; font-size: 16px; line-height: 1.25; }
  .badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; white-space: nowrap; }
  .meta { margin-top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); }
  .status-text.overdue { color: var(--brick); font-weight: 600; }
  .status-text.soon { color: #8a6a1f; font-weight: 600; }
  .status-text.ontrack { color: var(--forest); }
  .assignee { margin-top: 8px; font-size: 12px; color: var(--ink-soft); }
  .assignee.sarah { color: var(--sarah); font-weight: 600; }
  .assignee.britt { color: var(--britt); font-weight: 600; }
  .unassigned-label { color: var(--ink-soft); font-weight: 400; }
  .done-btn { margin-top: 14px; width: 100%; padding: 9px 0; border-radius: 7px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; }
  .done-btn:active { transform: scale(0.97); }
  .empty { font-family: 'IBM Plex Mono', monospace; color: var(--ink-soft); font-size: 13px; }
  footer { margin-top: 40px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); text-align: center; }
  #connStatus { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  .tab-btn.active { background: var(--ink); color: var(--paper); }

  .primary-nav { display: flex; gap: 8px; }
  .primary-nav-btn { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; padding: 8px 18px; border-radius: 9px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  .primary-nav-btn.active { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 rgba(43,46,38,0.15); }

  .seg-group { display: inline-flex; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 16px; }
  .seg-btn { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; padding: 6px 16px; border-radius: 7px; border: none; background: transparent; color: var(--ink); cursor: pointer; }
  .seg-btn.active { background: var(--ink); color: var(--paper); }

  .cal-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .cal-toolbar button { border: 1.5px solid var(--ink); background: var(--card); border-radius: 6px; padding: 5px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer; }
  .cal-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; flex: 1; }

  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .day-col { background: var(--card); border: 1.5px solid var(--ink); border-radius: 10px; padding: 10px; min-height: 160px; }
  .day-col.today { border-color: var(--forest); box-shadow: 0 0 0 2px var(--forest-tint); }
  .day-head { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); text-transform: uppercase; margin-bottom: 6px; }
  .day-num { font-family: 'Fraunces', serif; font-weight: 700; font-size: 20px; margin-bottom: 8px; }
  .evt { background: var(--unassigned-tint); border-left: 3px solid var(--unassigned); border-radius: 5px; padding: 4px 6px; font-size: 12px; margin-bottom: 5px; }
  .evt .t { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); display: block; }
  .evt.sarah { background: var(--sarah-tint); border-left-color: var(--sarah); }
  .evt.britt { background: var(--britt-tint); border-left-color: var(--britt); }

  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .month-headrow { display: contents; }
  .month-headcell { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); text-transform: uppercase; text-align: center; padding-bottom: 4px; }
  .month-cell { background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px; min-height: 90px; }
  .month-cell.out { opacity: 0.4; }
  .month-cell.today { border-color: var(--forest); }
  .month-daynum { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .month-evt { font-size: 11px; background: var(--unassigned-tint); border-radius: 4px; padding: 1px 4px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .month-evt.sarah { background: var(--sarah-tint); }
  .month-evt.britt { background: var(--britt-tint); }

  /* Timetable week view */
  .tt-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tt-wrap { border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; background: var(--card); min-width: 560px; }
  .tt-header-row, .tt-allday-row { display: grid; grid-template-columns: 50px repeat(7, minmax(66px, 1fr)); }
  .tt-header-row { border-bottom: 1.5px solid var(--ink); }
  .tt-allday-row { border-bottom: 1.5px solid var(--line); min-height: 26px; }
  .tt-corner { border-right: 1px solid var(--line); }
  .tt-day-header { text-align: center; padding: 7px 3px; border-left: 1px solid var(--line); font-family: 'IBM Plex Mono', monospace; }
  .tt-day-header .dh-name { font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; }
  .tt-day-header .dh-num { font-family: 'Fraunces', serif; font-weight: 700; font-size: 17px; }
  .tt-day-header.today { background: var(--forest-tint); }
  .tt-allday-label { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--ink-soft); padding: 4px; border-right: 1px solid var(--line); }
  .tt-allday-cell { border-left: 1px solid var(--line); padding: 3px; }
  .tt-allday-evt { font-size: 11px; border-radius: 4px; padding: 2px 5px; margin-bottom: 2px; background: var(--unassigned-tint); }
  .tt-allday-evt.sarah { background: var(--sarah-tint); }
  .tt-allday-evt.britt { background: var(--britt-tint); }

  .tt-body { display: grid; grid-template-columns: 50px repeat(7, minmax(66px, 1fr)); max-height: 60vh; overflow-y: auto; }
  .tt-hours-col { border-right: 1px solid var(--line); }
  .tt-hour-label { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--ink-soft); text-align: right; padding-right: 5px; box-sizing: border-box; transform: translateY(-6px); }
  .tt-day-col { position: relative; border-left: 1px solid var(--line); }
  .tt-day-col.today { background: rgba(63,90,68,0.05); }
  .tt-evt-block { position: absolute; left: 3px; right: 3px; border-radius: 5px; border-left: 3px solid var(--unassigned); background: var(--unassigned-tint); font-size: 10.5px; line-height: 1.25; padding: 3px 5px; overflow: hidden; box-sizing: border-box; }
  .tt-evt-block.sarah { border-left-color: var(--sarah); background: var(--sarah-tint); }
  .tt-evt-block.britt { border-left-color: var(--britt); background: var(--britt-tint); }
  .tt-evt-block .tt-evt-time { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; color: var(--ink-soft); }

  /* Meal planning */
  .meal-grid { display: grid; grid-template-columns: 84px repeat(7, 1fr); gap: 1px; background: var(--line); border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .meal-headcell { background: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-align: center; padding: 8px 3px; font-weight: 600; }
  .meal-headcell.today { background: var(--forest-tint); }
  .meal-rowlabel { background: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); display: flex; align-items: center; padding: 8px; text-transform: uppercase; }
  .meal-cell { background: var(--card); padding: 8px 6px; font-size: 12px; min-height: 44px; }
  .meal-cell.today { background: var(--forest-tint); }
  .meal-cell .empty-dash { color: var(--line); }

  .shop-item { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .shop-item.checked { color: var(--ink-soft); text-decoration: line-through; }
  .shop-check { width: 19px; height: 19px; accent-color: var(--forest); }
  .meal-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .meal-grid { width: 100%; grid-template-columns: clamp(46px, 8%, 84px) repeat(7, minmax(42px, 1fr)); }
  .meal-headcell { font-size: clamp(8px, 1.4vw, 10.5px); padding: clamp(4px, 1vw, 8px) 3px; }
  .meal-rowlabel { font-size: clamp(7.5px, 1.3vw, 10px); padding: clamp(4px, 1vw, 8px); }
  .meal-cell { font-size: clamp(9px, 1.6vw, 12px); padding: clamp(3px, 1vw, 6px); min-height: clamp(34px, 6vw, 44px); }

  .med-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1.5px solid var(--ink); border-radius: 10px; }
  .med-table { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 13px; background: var(--card); }
  .med-table th { background: var(--ink); color: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 6px; text-align: left; }
  .med-table td { padding: 7px 6px; border-bottom: 1px solid var(--line); }
  .med-category-row td { background: var(--gold-tint); font-family: 'Fraunces', serif; font-weight: 600; font-size: 13.5px; padding: 7px 6px; }
  .med-reorder-cell.active { background: var(--brick-tint); font-weight: 600; }
  .med-expired { color: var(--brick); font-weight: 600; }
  .med-expiring { color: #8a6a1f; font-weight: 600; }
  .med-instock-yes { color: var(--forest); }
  .med-instock-no { color: var(--brick); }

  @media (max-width: 700px) {
    .wrap { padding: 16px 12px 40px; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-left">
      <h1>House Hub</h1>
      <div class="primary-nav">
        <button class="primary-nav-btn active" id="tabChores" onclick="switchTab('chores')">Chores</button>
        <button class="primary-nav-btn" id="tabCalendar" onclick="switchTab('calendar')">Calendar</button>
        <button class="primary-nav-btn" id="tabMeal" onclick="switchTab('meal')">Meal Planning</button>
        <button class="primary-nav-btn" id="tabMed" onclick="switchTab('med')">Medicine Cabinet</button>
      </div>
    </div>
    <div class="datebox"><div id="dateBox"></div><div id="connStatus">connecting…</div></div>
  </header>

  <div id="choresView">
    <div class="cal-toolbar" style="margin-bottom:10px;">
      <div class="cal-title" style="font-size:16px;" id="choresViewTitle">Upcoming chores</div>
      <button onclick="toggleShowAllChores()" id="showAllBtn">See all chores</button>
    </div>
    <div class="summary" id="summary"></div>
    <div id="sections"><div class="empty">Loading chores…</div></div>
  </div>

  <div id="calendarView" style="display:none;">
    <div class="seg-group">
      <button class="seg-btn" id="tabSchedule" onclick="switchCalMode('schedule')">Schedule</button>
      <button class="seg-btn active" id="tabWeek" onclick="switchCalMode('week')">Week</button>
      <button class="seg-btn" id="tabMonth" onclick="switchCalMode('month')">Month</button>
    </div>
    <div class="cal-toolbar">
      <button onclick="calNav(-1)">&larr; Prev</button>
      <div class="cal-title" id="calTitle"></div>
      <button onclick="calNav(1)">Next &rarr;</button>
      <button onclick="calToday()">Today</button>
    </div>
    <div style="display:flex; gap:14px; margin-bottom:12px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);">
      <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sarah);margin-right:4px;"></span>Sarah</span>
      <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--britt);margin-right:4px;"></span>Britt</span>
      <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--unassigned);margin-right:4px;"></span>Unassigned</span>
    </div>
    <div id="calGrid"></div>
  </div>

  <div id="mealView" style="display:none;">
    <div class="cal-toolbar">
      <button onclick="mealNav(-1)">&larr; Prev</button>
      <div class="cal-title" id="mealWeekTitle"></div>
      <button onclick="mealNav(1)">Next &rarr;</button>
      <button onclick="mealToday()">This week</button>
    </div>
    <div id="mealGrid"></div>

    <div class="section-label" style="margin-top:26px;">Shopping List<div class="dash"></div></div>
    <div id="shoppingList"></div>
  </div>

  <div id="medView" style="display:none;">
    <div id="medTable"></div>
  </div>

  <footer>tap a chore to mark it done &mdash; board updates live for everyone</footer>
</div>

<script src="recurrence.js?v=7"></script>
<script src="calendar.js?v=6"></script>

<!-- Firebase (modular SDK via CDN) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, onSnapshot, doc, updateDoc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ---- Fill these in from Firebase Console > Project Settings > General ----
const firebaseConfig = {
  apiKey: "AIzaSyDqun6iA6qtkPLT4E_--hPMyn7C7Ji1aIU",
  authDomain: "household-manager-4de34.firebaseapp.com",
  projectId: "household-manager-4de34",
  storageBucket: "household-manager-4de34.firebasestorage.app",
  messagingSenderId: "1054925325088",
  appId: "1:1054925325088:web:edd54d1ee36154864e8d45"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const choresCol = collection(db, "chores");
  const eventsCol = collection(db, "events");
  const mealPlanCol = collection(db, "mealPlan");
  const shoppingCol = collection(db, "shoppingItems");
  const medicineCol = collection(db, "medicineCabinet");

  let currentChores = [];
  let currentEvents = [];
  let currentMealPlan = [];
  let currentShopping = [];
  let currentMedicine = [];
  let calMode = "week"; // "schedule" (timetable) | "week" (simple list) | "month"
  let calOffset = 0;        // weeks or months from current, depending on calMode
  let mealWeekOffset = 0;

  onSnapshot(eventsCol, (snapshot) => {
    currentEvents = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderCalendar(); // always keep the grid in sync with the latest data, regardless of which tab is showing
  });

  onSnapshot(mealPlanCol, (snapshot) => {
    currentMealPlan = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderMeal();
  });

  onSnapshot(shoppingCol, (snapshot) => {
    currentShopping = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderMeal();
  });

  onSnapshot(medicineCol, (snapshot) => {
    currentMedicine = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderMedicine();
  });

  window.switchTab = function (tab) {
    document.getElementById("tabChores").classList.toggle("active", tab === "chores");
    document.getElementById("tabCalendar").classList.toggle("active", tab === "calendar");
    document.getElementById("tabMeal").classList.toggle("active", tab === "meal");
    document.getElementById("tabMed").classList.toggle("active", tab === "med");
    document.getElementById("choresView").style.display = tab === "chores" ? "block" : "none";
    document.getElementById("calendarView").style.display = tab === "calendar" ? "block" : "none";
    document.getElementById("mealView").style.display = tab === "meal" ? "block" : "none";
    document.getElementById("medView").style.display = tab === "med" ? "block" : "none";
    if (tab === "calendar") renderCalendar();
    if (tab === "meal") renderMeal();
    if (tab === "med") renderMedicine();
  };

  window.switchCalMode = function (mode) {
    calMode = mode;
    calOffset = 0;
    document.getElementById("tabSchedule").classList.toggle("active", mode === "schedule");
    document.getElementById("tabWeek").classList.toggle("active", mode === "week");
    document.getElementById("tabMonth").classList.toggle("active", mode === "month");
    renderCalendar();
  };

  window.calNav = function (dir) {
    calOffset += dir;
    renderCalendar();
  };

  window.calToday = function () {
    calOffset = 0;
    renderCalendar();
  };

  function assigneeClass(assignee) {
    if (assignee === "Sarah") return "sarah";
    if (assignee === "Britt") return "britt";
    return "";
  }

  const TT_START_HOUR = 0;   // full day — nothing gets excluded
  const TT_END_HOUR = 24;
  const TT_PX_PER_HOUR = 42;
  const TT_DEFAULT_SCROLL_HOUR = 7; // grid opens scrolled to ~7 AM, but all 24h are reachable

  function timeToMinutes(time) {
    const [h, m] = time.split(":").map(Number);
    return h * 60 + m;
  }

  function hourLabel(h) {
    const period = h >= 12 ? "PM" : "AM";
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${h12} ${period}`;
  }

  function renderCalendar() {
    const today = new Date();
    if (calMode === "week") {
      const days = buildWeekDays(calOffset);
      const rangeStart = days[0], rangeEnd = new Date(days[6]); rangeEnd.setHours(23, 59, 59, 999);
      const occurrences = expandOccurrences(currentEvents, rangeStart, rangeEnd);
      document.getElementById("calTitle").textContent =
        `${days[0].toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${days[6].toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
      document.getElementById("calGrid").innerHTML = `
        <div class="week-grid">
          ${days.map(d => `
            <div class="day-col ${isSameDay(d, today) ? "today" : ""}">
              <div class="day-head">${d.toLocaleDateString(undefined, { weekday: "short" })}</div>
              <div class="day-num">${d.getDate()}</div>
              ${occurrencesOnDate(occurrences, d).map(o => `
                <div class="evt ${assigneeClass(o.event.assignee)}">${o.event.time ? `<span class="t">${formatEventTime(o.event)}</span>` : ""}${o.event.title}${o.event.repeat ? " ↻" : ""}</div>
              `).join("") || ""}
            </div>
          `).join("")}
        </div>
      `;
    } else if (calMode === "schedule") {
      const days = buildWeekDays(calOffset);
      const rangeStart = days[0], rangeEnd = new Date(days[6]); rangeEnd.setHours(23, 59, 59, 999);
      const occurrences = expandOccurrences(currentEvents, rangeStart, rangeEnd);
      document.getElementById("calTitle").textContent =
        `${days[0].toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${days[6].toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;

      const totalHeight = (TT_END_HOUR - TT_START_HOUR) * TT_PX_PER_HOUR;
      const hours = [];
      for (let h = TT_START_HOUR; h < TT_END_HOUR; h++) hours.push(h);

      document.getElementById("calGrid").innerHTML = `
        <div class="tt-scroll">
        <div class="tt-wrap">
          <div class="tt-header-row">
            <div class="tt-corner"></div>
            ${days.map(d => `
              <div class="tt-day-header ${isSameDay(d, today) ? "today" : ""}">
                <div class="dh-name">${d.toLocaleDateString(undefined, { weekday: "short" })}</div>
                <div class="dh-num">${d.getDate()}</div>
              </div>
            `).join("")}
          </div>
          <div class="tt-allday-row">
            <div class="tt-allday-label">All day</div>
            ${days.map(d => {
              const allDay = occurrencesOnDate(occurrences, d).filter(o => !o.event.time);
              return `<div class="tt-allday-cell">${allDay.map(o => `
                <div class="tt-allday-evt ${assigneeClass(o.event.assignee)}">${o.event.title}${o.event.repeat ? " ↻" : ""}</div>
              `).join("")}</div>`;
            }).join("")}
          </div>
          <div class="tt-body">
            <div class="tt-hours-col" style="height:${totalHeight}px;">
              ${hours.map(h => `<div class="tt-hour-label" style="height:${TT_PX_PER_HOUR}px;">${hourLabel(h)}</div>`).join("")}
            </div>
            ${days.map(d => {
              const timed = occurrencesOnDate(occurrences, d).filter(o => o.event.time);
              return `
                <div class="tt-day-col ${isSameDay(d, today) ? "today" : ""}" style="height:${totalHeight}px; background-image: repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent ${TT_PX_PER_HOUR}px);">
                  ${timed.map(o => {
                    const startMin = timeToMinutes(o.event.time);
                    const rangeStartMin = TT_START_HOUR * 60, rangeEndMin = TT_END_HOUR * 60;
                    const durMin = o.event.durationMinutes || 60;
                    const top = Math.max(0, ((startMin - rangeStartMin) / 60) * TT_PX_PER_HOUR);
                    const rawHeight = (durMin / 60) * TT_PX_PER_HOUR;
                    const height = Math.max(15, Math.min(rawHeight, totalHeight - top));
                    if (startMin >= rangeEndMin || startMin + durMin <= rangeStartMin) return ""; // fully outside visible hours
                    return `
                      <div class="tt-evt-block ${assigneeClass(o.event.assignee)}" style="top:${top}px; height:${height}px;">
                        <span class="tt-evt-time">${formatEventTime(o.event)}</span>${o.event.title}${o.event.repeat ? " ↻" : ""}
                      </div>
                    `;
                  }).join("")}
                </div>
              `;
            }).join("")}
          </div>
        </div>
        </div>
      `;
      const ttBody = document.querySelector("#calGrid .tt-body");
      if (ttBody) ttBody.scrollTop = TT_DEFAULT_SCROLL_HOUR * TT_PX_PER_HOUR;
    } else {
      const cells = buildMonthDays(calOffset);
      const rangeStart = cells[0].date, rangeEnd = new Date(cells[41].date); rangeEnd.setHours(23, 59, 59, 999);
      const occurrences = expandOccurrences(currentEvents, rangeStart, rangeEnd);
      const monthLabel = new Date(cells[14].date).toLocaleDateString(undefined, { month: "long", year: "numeric" });
      document.getElementById("calTitle").textContent = monthLabel;
      const dayNames = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      document.getElementById("calGrid").innerHTML = `
        <div class="month-grid">
          ${dayNames.map(n => `<div class="month-headcell">${n}</div>`).join("")}
          ${cells.map(({ date, inMonth }) => `
            <div class="month-cell ${inMonth ? "" : "out"} ${isSameDay(date, today) ? "today" : ""}">
              <div class="month-daynum">${date.getDate()}</div>
              ${occurrencesOnDate(occurrences, date).map(o => `<div class="month-evt ${assigneeClass(o.event.assignee)}">${o.event.title}${o.event.repeat ? " ↻" : ""}</div>`).join("")}
            </div>
          `).join("")}
        </div>
      `;
    }
  }

  onSnapshot(choresCol, (snapshot) => {
    currentChores = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById("connStatus").textContent = "live";
    render();
  }, (err) => {
    document.getElementById("connStatus").textContent = "offline / error";
    console.error(err);
  });

  window.markDone = async function (id) {
    const today = new Date().toISOString().slice(0, 10);
    await updateDoc(doc(db, "chores", id), { lastCompleted: today });
    // onSnapshot will re-render automatically once the write lands
  };

  let showAllChores = false;

  window.toggleShowAllChores = function () {
    showAllChores = !showAllChores;
    render();
  };

  function render() {
    const today = new Date();
    document.getElementById("dateBox").textContent =
      today.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });

    document.getElementById("showAllBtn").textContent = showAllChores ? "Show upcoming only" : "See all chores";
    document.getElementById("choresViewTitle").textContent = showAllChores ? "All chores" : "Upcoming chores";

    if (currentChores.length === 0) {
      document.getElementById("sections").innerHTML = '<div class="empty">No chores yet — add some from the admin page.</div>';
      document.getElementById("summary").innerHTML = "";
      return;
    }

    const scored = currentChores.map(c => ({ chore: c, status: getStatus(c, today) }));
    scored.sort((a, b) => a.status.diffDays - b.status.diffDays);

    const counts = { overdue: 0, soon: 0, ontrack: 0 };
    scored.forEach(s => counts[s.status.tier]++);

    document.getElementById("summary").innerHTML = `
      <div class="pill overdue"><b>${counts.overdue}</b> overdue</div>
      <div class="pill soon"><b>${counts.soon}</b> due today/tomorrow</div>
      <div class="pill ontrack"><b>${counts.ontrack}</b> on track</div>
    `;

    const groups = [
      { key: "overdue", label: "Overdue" },
      { key: "soon", label: "Due Today / Tomorrow" },
      { key: "ontrack", label: "On Track" },
    ].filter(g => showAllChores || g.key !== "ontrack");

    const sectionsHtml = groups.map(g => {
      const items = scored.filter(s => s.status.tier === g.key);
      if (items.length === 0) return "";
      return `
        <div class="section-label">${g.label}<div class="dash"></div></div>
        <div class="board">
          ${items.map(({ chore, status }) => `
            <div class="card ${status.tier}">
              <div class="card-top">
                <div class="chore-name">${chore.name}</div>
                <div class="badge">${frequencyLabel(chore.repeat)}</div>
              </div>
              <div class="meta status-text ${status.tier}">${statusText(status)}</div>
              <div class="assignee ${assigneeClass(chore.assignee)}">${chore.assignee || '<span class="unassigned-label">Unassigned</span>'}</div>
              <button class="done-btn" onclick="markDone('${chore.id}')">Mark done</button>
            </div>
          `).join("")}
        </div>
      `;
    }).join("");

    document.getElementById("sections").innerHTML = sectionsHtml ||
      `<div class="empty">Nothing overdue or due soon — everything's on track. ${!showAllChores ? '"See all chores" shows the rest.' : ""}</div>`;
  }

  setInterval(render, 60 * 1000); // recompute status even if no new writes come in

  // ---------- Meal planning ----------
  const MEAL_TYPES = ["breakfast", "lunch", "dinner", "snack"];
  const MEAL_LABELS = { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner", snack: "Snack" };

  window.mealNav = function (dir) {
    mealWeekOffset += dir;
    renderMeal();
  };

  window.mealToday = function () {
    mealWeekOffset = 0;
    renderMeal();
  };

  window.toggleShoppingItem = async function (id, checked) {
    try {
      await updateDoc(doc(db, "shoppingItems", id), { checked });
    } catch (err) {
      alert("Couldn't update item: " + err.message);
    }
  };

  function findMealTitle(dateStr, type) {
    const m = currentMealPlan.find(m => m.date === dateStr && m.mealType === type);
    return m && m.title ? m.title : "";
  }

  function renderMeal() {
    const today = new Date();
    const days = buildWeekDays(mealWeekOffset);
    document.getElementById("mealWeekTitle").textContent =
      `${days[0].toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${days[6].toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;

    document.getElementById("mealGrid").innerHTML = `
      <div class="meal-scroll">
      <div class="meal-grid">
        <div class="meal-headcell"></div>
        ${days.map(d => `<div class="meal-headcell ${isSameDay(d, today) ? "today" : ""}">${d.toLocaleDateString(undefined, { weekday: "short" })} ${d.getDate()}</div>`).join("")}
        ${MEAL_TYPES.map(type => `
          <div class="meal-rowlabel">${MEAL_LABELS[type]}</div>
          ${days.map(d => {
            const title = findMealTitle(isoDate(d), type);
            return `<div class="meal-cell ${isSameDay(d, today) ? "today" : ""}">${title || '<span class="empty-dash">—</span>'}</div>`;
          }).join("")}
        `).join("")}
      </div>
      </div>
    `;

    const sorted = [...currentShopping].sort((a, b) => (a.checked === b.checked ? 0 : a.checked ? 1 : -1));
    document.getElementById("shoppingList").innerHTML = sorted.length
      ? sorted.map(item => `
          <div class="shop-item ${item.checked ? "checked" : ""}">
            <input type="checkbox" class="shop-check" ${item.checked ? "checked" : ""} onchange="toggleShoppingItem('${item.id}', this.checked)">
            <span>${item.text}</span>
          </div>
        `).join("")
      : `<div class="empty">Nothing on the list.</div>`;
  }

  // ---------- Medicine cabinet (read-only display; edited from the admin page) ----------
  function medExpirationClass(dateStr) {
    if (!dateStr) return "";
    const exp = new Date(dateStr + "T00:00:00");
    const today = new Date();
    const diffDays = Math.round((exp - today) / 86400000);
    if (diffDays < 0) return "med-expired";
    if (diffDays <= 60) return "med-expiring";
    return "";
  }

  function renderMedicine() {
    const sorted = [...currentMedicine].sort((a, b) => (a.category || "").localeCompare(b.category || "") || a.name.localeCompare(b.name));
    const rows = [];
    let lastCategory = null;
    sorted.forEach(item => {
      const cat = item.category || "Uncategorized";
      if (cat !== lastCategory) {
        rows.push(`<tr class="med-category-row"><td colspan="6">${cat}</td></tr>`);
        lastCategory = cat;
      }
      rows.push(`
        <tr>
          <td>${item.name}</td>
          <td>${item.notes || ""}</td>
          <td>${item.brands || ""}</td>
          <td class="${item.inStock ? "med-instock-yes" : "med-instock-no"}">${item.inStock ? "Y" : "N"}</td>
          <td class="${medExpirationClass(item.expirationDate)}">${item.expirationDate || ""}</td>
          <td class="med-reorder-cell ${item.reorderNow ? "active" : ""}">${item.reorderNow ? "Y" : ""}</td>
        </tr>
      `);
    });

    document.getElementById("medTable").innerHTML = `
      <div class="med-scroll">
        <table class="med-table">
          <thead>
            <tr><th>Active Ingredient</th><th>Notes</th><th>Brand(s)</th><th>In Stock?</th><th>Expiration</th><th>Reorder?</th></tr>
          </thead>
          <tbody>
            ${rows.join("") || '<tr><td colspan="6" style="padding:14px 6px; color:var(--ink-soft); font-family:\'IBM Plex Mono\',monospace; font-size:13px;">Nothing added yet.</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  }
</script>
</body>
</html>
