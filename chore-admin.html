<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Hub – Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#EDE6D6; --card:#FBF8F0; --ink:#2B2E26; --ink-soft:#5C6156; --line:#DCD3BE; --forest:#3F5A44; --forest-tint:#E3E9E1; --brick:#A8452E; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; padding: 20px 16px 60px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-family:'Fraunces',serif; font-size: 28px; margin: 0 0 4px; }
  p.sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 20px; }
  .gate { background: var(--card); border: 1.5px solid var(--ink); border-radius: 10px; padding: 20px; }
  .gate input { width: 100%; padding: 10px; font-size: 15px; border-radius: 6px; border: 1px solid var(--line); margin-bottom: 10px; box-sizing: border-box; }
  .gate button, .save-btn, .add-btn { background: var(--ink); color: var(--paper); border: none; border-radius: 7px; padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 14px; }
  .card { background: var(--card); border: 1.5px solid var(--ink); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .row label { display: flex; flex-direction: column; font-size: 11px; color: var(--ink-soft); font-family:'IBM Plex Mono',monospace; flex: 1; min-width: 110px; }
  input, select { padding: 8px; border-radius: 6px; border: 1px solid var(--line); font-size: 14px; font-family: 'Inter', sans-serif; }
  .del-btn { background: transparent; color: var(--brick); border: 1px solid var(--brick); border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 12px; }
  #status { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); }
  .tab-btn { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  .tab-btn.active { background: var(--ink); color: var(--paper); }
  .cal-toolbar button { border: 1.5px solid var(--ink); background: var(--card); border-radius: 6px; padding: 5px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(43,46,38,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-box { background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px; padding: 20px; max-width: 480px; width: 100%; max-height: 85vh; overflow: auto; box-shadow: 4px 4px 0 rgba(43,46,38,0.15); }
  .modal-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 20px; margin: 0 0 14px; }
  #showPastBtn { border: 1.5px solid var(--ink); background: var(--card); border-radius: 6px; padding: 8px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer; white-space: nowrap; }
  #showPastBtn.active { background: var(--ink); color: var(--paper); }
  .month-group-label { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; color: var(--ink-soft); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.03em; }
  .meal-grid { display: grid; grid-template-columns: 84px repeat(7, 1fr); gap: 1px; background: var(--line); border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .meal-headcell { background: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-align: center; padding: 8px 3px; font-weight: 600; }
  .meal-headcell.today { background: var(--forest-tint); }
  .meal-rowlabel { background: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); display: flex; align-items: center; padding: 8px; text-transform: uppercase; }
  .meal-cell { background: var(--card); padding: 6px; font-size: 12px; min-height: 40px; }
  .meal-cell.today { background: var(--forest-tint); }
  .shop-item { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .shop-item.checked { color: var(--ink-soft); text-decoration: line-through; }
  .shop-check { width: 19px; height: 19px; accent-color: var(--forest); }
  .meal-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .meal-grid { width: 100%; grid-template-columns: clamp(46px, 8%, 84px) repeat(7, minmax(42px, 1fr)); }
  .meal-headcell { font-size: clamp(8px, 1.4vw, 10.5px); padding: clamp(4px, 1vw, 8px) 3px; }
  .meal-rowlabel { font-size: clamp(7.5px, 1.3vw, 10px); padding: clamp(4px, 1vw, 8px); }
  .meal-cell { font-size: clamp(9px, 1.6vw, 12px); padding: clamp(3px, 1vw, 6px); min-height: clamp(34px, 6vw, 44px); }

  .med-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1.5px solid var(--ink); border-radius: 10px; }
  .med-table { width: 100%; min-width: 720px; border-collapse: collapse; font-size: 12.5px; background: var(--card); }
  .med-table th { background: var(--ink); color: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 6px; text-align: left; position: sticky; top: 0; }
  .med-table td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .med-category-row td { background: var(--gold-tint); font-family: 'Fraunces', serif; font-weight: 600; font-size: 13px; padding: 7px 6px; }
  .med-table input[type="text"] { width: 100%; border: none; background: transparent; font-family: 'Inter', sans-serif; font-size: 12.5px; }
  .med-table input[type="date"] { border: none; background: transparent; font-family: 'IBM Plex Mono', monospace; font-size: 11px; width: 100%; }
  .med-check { width: 17px; height: 17px; }
  .med-reorder-cell.active { background: var(--brick-tint); }
  .med-expired { color: var(--brick); font-weight: 600; }
  .med-expiring { color: #8a6a1f; font-weight: 600; }
  .med-del-btn { border: none; background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 14px; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
  .filter-row input[type="text"] { flex: 1; padding: 9px 10px; border-radius: 6px; border: 1px solid var(--line); font-size: 14px; }

  .month-header { font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }

  .event-row { background: var(--card); border: 1.5px solid var(--ink); border-radius: 8px; padding: 10px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .event-row .edate { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); width: 90px; flex-shrink: 0; }
  .event-row .etitle { flex: 1; font-weight: 600; font-size: 14px; }
  .event-row .erepeat-tag { font-size: 12px; color: var(--forest); }
  .event-row .quick-del { background: transparent; color: var(--brick); border: 1px solid var(--brick); border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
  .event-row .caret { color: var(--ink-soft); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>House Hub Admin</h1>
  <p class="sub">Add, edit, or remove chores. Changes appear on the wall board within a minute.</p>

  <div class="gate" id="gate">
    <div style="margin-bottom:10px; font-size:14px;">Sign in to edit chores</div>
    <input type="email" id="emailInput" placeholder="email" autocomplete="username">
    <input type="password" id="passwordInput" placeholder="password" autocomplete="current-password">
    <button onclick="doLogin()">Sign in</button>
    <div id="gateError" style="color:var(--brick); font-size:12px; margin-top:6px;"></div>
  </div>

  <div id="app" style="display:none;">
    <div class="tabs" style="display:flex; gap:8px; margin-bottom:16px;">
      <button class="tab-btn active" id="tabChoresAdmin" onclick="switchAdminTab('chores')">Chores</button>
      <button class="tab-btn" id="tabEventsAdmin" onclick="switchAdminTab('events')">Events</button>
      <button class="tab-btn" id="tabMealAdmin" onclick="switchAdminTab('meal')">Meal Planning</button>
      <button class="tab-btn" id="tabMedAdmin" onclick="switchAdminTab('med')">Medicine Cabinet</button>
    </div>

    <div id="choresAdmin">
      <div class="toolbar">
        <span id="status"></span>
        <div>
          <button class="add-btn" onclick="addBlankChore()">+ Add chore</button>
          <button class="del-btn" style="margin-left:8px;" onclick="doLogout()">Sign out</button>
        </div>
      </div>
      <div id="list"></div>
    </div>

    <div id="eventsAdmin" style="display:none;">
      <div class="toolbar">
        <span id="eventStatus"></span>
        <div>
          <button class="add-btn" onclick="addBlankEvent()">+ Add event</button>
          <button class="del-btn" style="margin-left:8px;" onclick="doLogout()">Sign out</button>
        </div>
      </div>
      <div class="row" style="margin-bottom:10px;">
        <input id="eventSearch" placeholder="Search events…" style="flex:1;" oninput="onEventSearchInput(this.value)">
        <button id="showPastBtn" onclick="toggleShowPastEvents()">Show past events</button>
      </div>
      <div id="eventList"></div>
    </div>

    <div id="mealAdmin" style="display:none;">
      <div class="cal-toolbar" style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
        <button onclick="mealAdminNav(-1)">&larr; Prev</button>
        <div style="flex:1; font-family:'Fraunces',serif; font-weight:600; font-size:16px;" id="mealAdminWeekTitle"></div>
        <button onclick="mealAdminNav(1)">Next &rarr;</button>
        <button onclick="mealAdminToday()">This week</button>
      </div>
      <div id="mealAdminGrid" style="margin-bottom:26px;"></div>

      <div class="toolbar">
        <span id="shopStatus"></span>
        <div>
          <button class="add-btn" onclick="addBlankShoppingItem()">+ Add item</button>
          <button class="del-btn" style="margin-left:8px;" onclick="doLogout()">Sign out</button>
        </div>
      </div>
      <div id="shopAdminList"></div>
    </div>

    <div id="medAdmin" style="display:none;">
      <div class="toolbar">
        <span id="medStatus"></span>
        <div>
          <button class="add-btn" onclick="addBlankMedicine()">+ Add medicine</button>
          <button class="del-btn" style="margin-left:8px;" onclick="doLogout()">Sign out</button>
        </div>
      </div>
      <p style="font-size:12px; color:var(--ink-soft); margin:6px 0 14px;">Checking "Reorder?" automatically adds the item to the shopping list on the Meal Planning page — unchecking it removes it again.</p>
      <div id="medAdminTable"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="if(event.target===this) closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<script src="calendar.js?v=1"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, addDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // ---- Same config as chore-board.html ----
const firebaseConfig = {
  apiKey: "AIzaSyDqun6iA6qtkPLT4E_--hPMyn7C7Ji1aIU",
  authDomain: "household-manager-4de34.firebaseapp.com",
  projectId: "household-manager-4de34",
  storageBucket: "household-manager-4de34.firebasestorage.app",
  messagingSenderId: "1054925325088",
  appId: "1:1054925325088:web:edd54d1ee36154864e8d45"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const choresCol = collection(db, "chores");
  const eventsCol = collection(db, "events");
  const mealPlanCol = collection(db, "mealPlan");
  const shoppingCol = collection(db, "shoppingItems");
  const medicineCol = collection(db, "medicineCabinet");

  window.switchAdminTab = function (tab) {
    document.getElementById("tabChoresAdmin").classList.toggle("active", tab === "chores");
    document.getElementById("tabEventsAdmin").classList.toggle("active", tab === "events");
    document.getElementById("tabMealAdmin").classList.toggle("active", tab === "meal");
    document.getElementById("tabMedAdmin").classList.toggle("active", tab === "med");
    document.getElementById("choresAdmin").style.display = tab === "chores" ? "block" : "none";
    document.getElementById("eventsAdmin").style.display = tab === "events" ? "block" : "none";
    document.getElementById("mealAdmin").style.display = tab === "meal" ? "block" : "none";
    document.getElementById("medAdmin").style.display = tab === "med" ? "block" : "none";
  };

  window.doLogin = async function () {
    const email = document.getElementById("emailInput").value;
    const password = document.getElementById("passwordInput").value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      document.getElementById("gateError").textContent = "Sign-in failed — check email/password.";
    }
  };

  window.doLogout = function () {
    signOut(auth);
  };

  onAuthStateChanged(auth, (user) => {
    document.getElementById("gate").style.display = user ? "none" : "block";
    document.getElementById("app").style.display = user ? "block" : "none";
  });

  let chores = [];

  onSnapshot(choresCol, (snap) => {
    chores = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById("status").textContent = `${chores.length} chores`;
    renderList();
  });

  window.addBlankChore = async function () {
    const draft = {
      name: "New chore",
      assignee: null,
      repeat: { type: "days", value: 7 },
      lastCompleted: new Date().toISOString().slice(0, 10),
    };
    try {
      const docRef = await addDoc(choresCol, draft);
      openChoreModal({ id: docRef.id, ...draft });
    } catch (err) {
      alert("Couldn't add chore: " + err.message);
    }
  };

  window.saveChore = async function (id) {
    const name = document.getElementById(`name-${id}`).value;
    const assignee = document.getElementById(`assignee-${id}`).value || null;
    const type = document.getElementById(`type-${id}`).value;
    const lastCompleted = document.getElementById(`last-${id}`).value;

    let repeat;
    if (type === "days") {
      repeat = { type: "days", value: Number(document.getElementById(`val1-${id}`).value) };
    } else if (type === "rate") {
      repeat = { type: "rate", times: Number(document.getElementById(`val1-${id}`).value), perDays: Number(document.getElementById(`val2-${id}`).value) };
    } else if (type === "months") {
      repeat = { type: "months", value: Number(document.getElementById(`val1-${id}`).value) };
    } else if (type === "years") {
      repeat = { type: "years", value: Number(document.getElementById(`val1-${id}`).value) };
    }

    await updateDoc(doc(db, "chores", id), { name, assignee, repeat, lastCompleted });
  };

  window.deleteChore = async function (id) {
    if (confirm("Delete this chore?")) await deleteDoc(doc(db, "chores", id));
  };

  // ---------- Events ----------
  let events = [];
  let eventSearchText = "";
  let showPastEvents = false;

  onSnapshot(eventsCol, (snap) => {
    events = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
    renderEventList();
  });

  window.onEventSearchInput = function (val) {
    eventSearchText = val.trim().toLowerCase();
    renderEventList();
  };

  window.toggleShowPastEvents = function () {
    showPastEvents = !showPastEvents;
    document.getElementById("showPastBtn").classList.toggle("active", showPastEvents);
    document.getElementById("showPastBtn").textContent = showPastEvents ? "Hide past events" : "Show past events";
    renderEventList();
  };

  window.addBlankEvent = async function () {
    const draft = {
      title: "New event",
      date: new Date().toISOString().slice(0, 10),
      time: "",
      notes: "",
      assignee: null,
      durationMinutes: null,
    };
    try {
      const docRef = await addDoc(eventsCol, draft);
      openEventModal({ id: docRef.id, ...draft });
    } catch (err) {
      alert("Couldn't add event: " + err.message);
    }
  };

  window.saveEvent = async function (id) {
    const title = document.getElementById(`etitle-${id}`).value;
    const date = document.getElementById(`edate-${id}`).value;
    const time = document.getElementById(`etime-${id}`).value;
    const notes = document.getElementById(`enotes-${id}`).value;
    const repeatType = document.getElementById(`erepeat-${id}`).value;
    const assignee = document.getElementById(`eassignee-${id}`).value || null;
    const durVal = document.getElementById(`edur-${id}`).value;
    const durationMinutes = durVal ? Number(durVal) : null;

    let repeat = null;
    if (repeatType === "days") {
      repeat = { type: "days", value: Number(document.getElementById(`erval1-${id}`).value) };
    } else if (repeatType === "rate") {
      repeat = { type: "rate", times: Number(document.getElementById(`erval1-${id}`).value), perDays: Number(document.getElementById(`erval2-${id}`).value) };
    } else if (repeatType === "months") {
      repeat = { type: "months", value: Number(document.getElementById(`erval1-${id}`).value) };
    } else if (repeatType === "years") {
      repeat = { type: "years", value: Number(document.getElementById(`erval1-${id}`).value) };
    }

    try {
      await updateDoc(doc(db, "events", id), { title, date, time, notes, repeat, assignee, durationMinutes });
    } catch (err) {
      alert("Couldn't save event: " + err.message);
    }
  };

  window.deleteEvent = async function (id) {
    if (!confirm("Delete this event?")) return;
    try {
      await deleteDoc(doc(db, "events", id));
    } catch (err) {
      alert("Couldn't delete event: " + err.message);
    }
  };

  function eventRepeatFields(e) {
    const r = e.repeat;
    const id = e.id;
    const type = r ? r.type : "none";
    if (type === "rate") {
      return `
        <label>Times<input type="number" id="erval1-${id}" value="${r.times}"></label>
        <label>Per days<input type="number" id="erval2-${id}" value="${r.perDays}"></label>
      `;
    }
    return `<label>Every<input type="number" id="erval1-${id}" value="${r ? r.value : 1}" ${type === "none" ? "disabled" : ""}></label><div id="erval2-${id}" style="display:none;"></div>`;
  }

  function eventCardHtml(e) {
    return `
      <div class="card">
        <div class="row">
          <label>Title<input id="etitle-${e.id}" value="${e.title}"></label>
          <label>Date<input type="date" id="edate-${e.id}" value="${e.date}"></label>
          <label>Time (optional)<input type="time" id="etime-${e.id}" value="${e.time || ""}"></label>
          <label>Duration (min, optional)<input type="number" id="edur-${e.id}" value="${e.durationMinutes || ""}" min="0" step="15"></label>
        </div>
        <div class="row">
          <label style="flex:1;">Notes<input id="enotes-${e.id}" value="${e.notes || ""}"></label>
          <label>Assigned to
            <select id="eassignee-${e.id}">
              <option value="" ${!e.assignee ? "selected" : ""}>Unassigned</option>
              <option value="Sarah" ${e.assignee === "Sarah" ? "selected" : ""}>Sarah</option>
              <option value="Britt" ${e.assignee === "Britt" ? "selected" : ""}>Britt</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>Repeats
            <select id="erepeat-${e.id}" onchange="window.__rerenderEventRow('${e.id}', this.value)">
              <option value="none" ${!e.repeat ? "selected" : ""}>Doesn't repeat</option>
              <option value="days" ${e.repeat && e.repeat.type === "days" ? "selected" : ""}>Fixed days</option>
              <option value="rate" ${e.repeat && e.repeat.type === "rate" ? "selected" : ""}>X times per Y days</option>
              <option value="months" ${e.repeat && e.repeat.type === "months" ? "selected" : ""}>Months</option>
              <option value="years" ${e.repeat && e.repeat.type === "years" ? "selected" : ""}>Years</option>
            </select>
          </label>
          ${eventRepeatFields(e)}
        </div>
        <div class="row" style="justify-content:flex-end;">
          <button class="del-btn" onclick="deleteEvent('${e.id}')">Delete</button>
          <button class="save-btn" onclick="saveEvent('${e.id}')">Save</button>
        </div>
      </div>
    `;
  }

  function renderEventList() {
    const todayStr = new Date().toISOString().slice(0, 10);

    let visible = events.filter(e => {
      if (!showPastEvents && !e.repeat && e.date < todayStr) return false;
      if (eventSearchText) {
        const hay = (e.title + " " + (e.notes || "")).toLowerCase();
        if (!hay.includes(eventSearchText)) return false;
      }
      return true;
    });

    document.getElementById("eventStatus").textContent = `${visible.length} of ${events.length} events`;

    if (visible.length === 0) {
      document.getElementById("eventList").innerHTML = `<div style="font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); padding:10px 0;">No matching events.</div>`;
      return;
    }

    // group by year-month, in date order
    const groups = [];
    let lastKey = null;
    visible.forEach(e => {
      const key = e.date.slice(0, 7); // YYYY-MM
      if (key !== lastKey) {
        groups.push({ key, label: new Date(e.date + "T00:00:00").toLocaleDateString(undefined, { month: "long", year: "numeric" }), items: [] });
        lastKey = key;
      }
      groups[groups.length - 1].items.push(e);
    });

    document.getElementById("eventList").innerHTML = groups.map(g => `
      <div class="month-group-label">${g.label}</div>
      ${g.items.map(eventCardHtml).join("")}
    `).join("");
  }

  window.__rerenderEventRow = function (id, newType) {
    const ev = events.find(e => e.id === id);
    if (newType === "none") ev.repeat = null;
    else if (newType === "rate") ev.repeat = { type: "rate", times: 1, perDays: 7 };
    else ev.repeat = { type: newType, value: 1 };
    renderEventList();
  };

  function repeatFields(chore) {
    const r = chore.repeat || { type: "days", value: 1 };
    const id = chore.id;
    if (r.type === "rate") {
      return `
        <label>Times<input type="number" id="val1-${id}" value="${r.times}"></label>
        <label>Per days<input type="number" id="val2-${id}" value="${r.perDays}"></label>
      `;
    }
    return `<label>Every<input type="number" id="val1-${id}" value="${r.value}"></label><div id="val2-${id}" style="display:none;"></div>`;
  }

  function renderList() {
    document.getElementById("list").innerHTML = chores.map(c => `
      <div class="card">
        <div class="row">
          <label>Name<input id="name-${c.id}" value="${c.name}"></label>
          <label>Assignee
            <select id="assignee-${c.id}">
              <option value="" ${!c.assignee || c.assignee === "Unassigned" ? "selected" : ""}>Unassigned</option>
              <option value="Sarah" ${c.assignee === "Sarah" ? "selected" : ""}>Sarah</option>
              <option value="Britt" ${c.assignee === "Britt" ? "selected" : ""}>Britt</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>Repeat type
            <select id="type-${c.id}" onchange="window.__rerenderRow('${c.id}', this.value)">
              <option value="days" ${c.repeat.type === "days" ? "selected" : ""}>Fixed days</option>
              <option value="rate" ${c.repeat.type === "rate" ? "selected" : ""}>X times per Y days</option>
              <option value="months" ${c.repeat.type === "months" ? "selected" : ""}>Months</option>
              <option value="years" ${c.repeat.type === "years" ? "selected" : ""}>Years</option>
            </select>
          </label>
          ${repeatFields(c)}
          <label>Last completed<input type="date" id="last-${c.id}" value="${c.lastCompleted}"></label>
        </div>
        <div class="row" style="justify-content:flex-end;">
          <button class="del-btn" onclick="deleteChore('${c.id}')">Delete</button>
          <button class="save-btn" onclick="saveChore('${c.id}')">Save</button>
        </div>
      </div>
    `).join("");
  }

  // when repeat type dropdown changes, swap the value fields before saving
  window.__rerenderRow = function (id, newType) {
    const chore = chores.find(c => c.id === id);
    chore.repeat = newType === "rate"
      ? { type: "rate", times: 6, perDays: 10 }
      : { type: newType, value: 1 };
    renderList();
  };

  // ---------- New-item popup ----------
  // Opens right after a chore/event is created so the person doesn't have
  // to scroll the (potentially long) list to find and fill in what they just added.
  let modalKind = null;   // "chore" | "event"
  let modalDraft = null;

  window.closeModal = function () {
    document.getElementById("modalOverlay").style.display = "none";
    modalKind = null;
    modalDraft = null;
  };

  function showModal() {
    document.getElementById("modalOverlay").style.display = "flex";
  }

  window.openChoreModal = function (chore) {
    modalKind = "chore";
    modalDraft = JSON.parse(JSON.stringify(chore));
    renderModal();
    showModal();
  };

  window.openEventModal = function (event) {
    modalKind = "event";
    modalDraft = JSON.parse(JSON.stringify(event));
    renderModal();
    showModal();
  };

  window.openShoppingModal = function (item) {
    modalKind = "shopping";
    modalDraft = JSON.parse(JSON.stringify(item));
    renderModal();
    showModal();
  };

  window.openMedicineModal = function (item) {
    modalKind = "medicine";
    modalDraft = JSON.parse(JSON.stringify(item));
    renderModal();
    showModal();
  };

  window.modalChoreTypeChange = function (newType) {
    modalDraft.repeat = newType === "rate" ? { type: "rate", times: 6, perDays: 10 } : { type: newType, value: 1 };
    renderModal();
  };

  window.modalEventTypeChange = function (newType) {
    modalDraft.repeat = newType === "none" ? null
      : newType === "rate" ? { type: "rate", times: 1, perDays: 7 }
      : { type: newType, value: 1 };
    renderModal();
  };

  function modalChoreRepeatFields() {
    const r = modalDraft.repeat || { type: "days", value: 1 };
    if (r.type === "rate") {
      return `<label>Times<input type="number" id="m-val1" value="${r.times}"></label><label>Per days<input type="number" id="m-val2" value="${r.perDays}"></label>`;
    }
    return `<label>Every<input type="number" id="m-val1" value="${r.value}"></label><div id="m-val2" style="display:none;"></div>`;
  }

  function modalEventRepeatFields() {
    const r = modalDraft.repeat;
    const type = r ? r.type : "none";
    if (type === "rate") {
      return `<label>Times<input type="number" id="m-erval1" value="${r.times}"></label><label>Per days<input type="number" id="m-erval2" value="${r.perDays}"></label>`;
    }
    return `<label>Every<input type="number" id="m-erval1" value="${r ? r.value : 1}" ${type === "none" ? "disabled" : ""}></label><div id="m-erval2" style="display:none;"></div>`;
  }

  function renderModal() {
    const box = document.getElementById("modalBox");
    if (modalKind === "chore") {
      const c = modalDraft;
      box.innerHTML = `
        <div class="modal-title">New chore</div>
        <div class="row">
          <label>Name<input id="m-name" value="${c.name}"></label>
          <label>Assignee
            <select id="m-assignee">
              <option value="" ${!c.assignee || c.assignee === "Unassigned" ? "selected" : ""}>Unassigned</option>
              <option value="Sarah" ${c.assignee === "Sarah" ? "selected" : ""}>Sarah</option>
              <option value="Britt" ${c.assignee === "Britt" ? "selected" : ""}>Britt</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>Repeat type
            <select id="m-type" onchange="window.modalChoreTypeChange(this.value)">
              <option value="days" ${c.repeat.type === "days" ? "selected" : ""}>Fixed days</option>
              <option value="rate" ${c.repeat.type === "rate" ? "selected" : ""}>X times per Y days</option>
              <option value="months" ${c.repeat.type === "months" ? "selected" : ""}>Months</option>
              <option value="years" ${c.repeat.type === "years" ? "selected" : ""}>Years</option>
            </select>
          </label>
          ${modalChoreRepeatFields()}
          <label>Last completed<input type="date" id="m-last" value="${c.lastCompleted}"></label>
        </div>
        <div class="row" style="justify-content:flex-end; margin-top:10px;">
          <button class="del-btn" onclick="deleteChore('${c.id}'); closeModal();">Delete</button>
          <button class="save-btn" onclick="saveModalChore()">Save & close</button>
        </div>
      `;
    } else if (modalKind === "event") {
      const e = modalDraft;
      box.innerHTML = `
        <div class="modal-title">New event</div>
        <div class="row">
          <label>Title<input id="m-etitle" value="${e.title}"></label>
          <label>Date<input type="date" id="m-edate" value="${e.date}"></label>
          <label>Time (optional)<input type="time" id="m-etime" value="${e.time || ""}"></label>
          <label>Duration (min, optional)<input type="number" id="m-edur" value="${e.durationMinutes || ""}" min="0" step="15"></label>
        </div>
        <div class="row">
          <label style="flex:1;">Notes<input id="m-enotes" value="${e.notes || ""}"></label>
          <label>Assigned to
            <select id="m-eassignee">
              <option value="" ${!e.assignee ? "selected" : ""}>Unassigned</option>
              <option value="Sarah" ${e.assignee === "Sarah" ? "selected" : ""}>Sarah</option>
              <option value="Britt" ${e.assignee === "Britt" ? "selected" : ""}>Britt</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>Repeats
            <select id="m-erepeat" onchange="window.modalEventTypeChange(this.value)">
              <option value="none" ${!e.repeat ? "selected" : ""}>Doesn't repeat</option>
              <option value="days" ${e.repeat && e.repeat.type === "days" ? "selected" : ""}>Fixed days</option>
              <option value="rate" ${e.repeat && e.repeat.type === "rate" ? "selected" : ""}>X times per Y days</option>
              <option value="months" ${e.repeat && e.repeat.type === "months" ? "selected" : ""}>Months</option>
              <option value="years" ${e.repeat && e.repeat.type === "years" ? "selected" : ""}>Years</option>
            </select>
          </label>
          ${modalEventRepeatFields()}
        </div>
        <div class="row" style="justify-content:flex-end; margin-top:10px;">
          <button class="del-btn" onclick="deleteEvent('${e.id}'); closeModal();">Delete</button>
          <button class="save-btn" onclick="saveModalEvent()">Save & close</button>
        </div>
      `;
    } else if (modalKind === "shopping") {
      const s = modalDraft;
      box.innerHTML = `
        <div class="modal-title">New shopping item</div>
        <div class="row">
          <label style="flex:1;">Item<input id="m-stext" value="${s.text}"></label>
        </div>
        <div class="row" style="justify-content:flex-end; margin-top:10px;">
          <button class="del-btn" onclick="deleteShoppingItem('${s.id}'); closeModal();">Delete</button>
          <button class="save-btn" onclick="saveModalShopping()">Save & close</button>
        </div>
      `;
    } else if (modalKind === "medicine") {
      const m = modalDraft;
      box.innerHTML = `
        <div class="modal-title">New medicine</div>
        <div class="row">
          <label style="flex:1;">Category<input id="m-mcategory" value="${m.category || ""}" placeholder="e.g. Pain relievers"></label>
        </div>
        <div class="row">
          <label style="flex:1;">Active ingredient<input id="m-mname" value="${m.name || ""}"></label>
        </div>
        <div class="row">
          <label style="flex:1;">Notes<input id="m-mnotes" value="${m.notes || ""}"></label>
          <label style="flex:1;">Brand(s)<input id="m-mbrands" value="${m.brands || ""}"></label>
        </div>
        <div class="row">
          <label>In stock?<input type="checkbox" id="m-minstock" ${m.inStock ? "checked" : ""} style="width:18px; height:18px; margin-top:6px;"></label>
          <label>Expiration<input type="date" id="m-mexpiration" value="${m.expirationDate || ""}"></label>
          <label>Reorder now?<input type="checkbox" id="m-mreorder" ${m.reorderNow ? "checked" : ""} style="width:18px; height:18px; margin-top:6px;"></label>
        </div>
        <div class="row" style="justify-content:flex-end; margin-top:10px;">
          <button class="del-btn" onclick="deleteMedicine('${m.id}'); closeModal();">Delete</button>
          <button class="save-btn" onclick="saveModalMedicine()">Save & close</button>
        </div>
      `;
    }
  }

  window.saveModalChore = async function () {
    const id = modalDraft.id;
    const name = document.getElementById("m-name").value;
    const assignee = document.getElementById("m-assignee").value || null;
    const type = document.getElementById("m-type").value;
    const lastCompleted = document.getElementById("m-last").value;

    let repeat;
    if (type === "days") repeat = { type: "days", value: Number(document.getElementById("m-val1").value) };
    else if (type === "rate") repeat = { type: "rate", times: Number(document.getElementById("m-val1").value), perDays: Number(document.getElementById("m-val2").value) };
    else if (type === "months") repeat = { type: "months", value: Number(document.getElementById("m-val1").value) };
    else if (type === "years") repeat = { type: "years", value: Number(document.getElementById("m-val1").value) };

    try {
      await updateDoc(doc(db, "chores", id), { name, assignee, repeat, lastCompleted });
      closeModal();
    } catch (err) {
      alert("Couldn't save chore: " + err.message);
    }
  };

  window.saveModalEvent = async function () {
    const id = modalDraft.id;
    const title = document.getElementById("m-etitle").value;
    const date = document.getElementById("m-edate").value;
    const time = document.getElementById("m-etime").value;
    const notes = document.getElementById("m-enotes").value;
    const repeatType = document.getElementById("m-erepeat").value;
    const assignee = document.getElementById("m-eassignee").value || null;
    const durVal = document.getElementById("m-edur").value;
    const durationMinutes = durVal ? Number(durVal) : null;

    let repeat = null;
    if (repeatType === "days") repeat = { type: "days", value: Number(document.getElementById("m-erval1").value) };
    else if (repeatType === "rate") repeat = { type: "rate", times: Number(document.getElementById("m-erval1").value), perDays: Number(document.getElementById("m-erval2").value) };
    else if (repeatType === "months") repeat = { type: "months", value: Number(document.getElementById("m-erval1").value) };
    else if (repeatType === "years") repeat = { type: "years", value: Number(document.getElementById("m-erval1").value) };

    try {
      await updateDoc(doc(db, "events", id), { title, date, time, notes, repeat, assignee, durationMinutes });
      closeModal();
    } catch (err) {
      alert("Couldn't save event: " + err.message);
    }
  };

  // ---------- Meal planning ----------
  const MEAL_TYPES = ["breakfast", "lunch", "dinner", "snack"];
  const MEAL_LABELS = { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner", snack: "Snack" };

  let mealPlanAdmin = [];
  let mealAdminWeekOffset = 0;
  let shoppingItemsAdmin = [];

  onSnapshot(mealPlanCol, (snap) => {
    mealPlanAdmin = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderMealAdminGrid();
  });

  onSnapshot(shoppingCol, (snap) => {
    shoppingItemsAdmin = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById("shopStatus").textContent = `${shoppingItemsAdmin.length} items`;
    renderShopAdminList();
  });

  window.mealAdminNav = function (dir) {
    mealAdminWeekOffset += dir;
    renderMealAdminGrid();
  };

  window.mealAdminToday = function () {
    mealAdminWeekOffset = 0;
    renderMealAdminGrid();
  };

  function findMealTitle(dateStr, type) {
    const m = mealPlanAdmin.find(m => m.date === dateStr && m.mealType === type);
    return m && m.title ? m.title : "";
  }

  window.saveMealCell = async function (dateStr, mealType, value) {
    try {
      await setDoc(doc(db, "mealPlan", `${dateStr}_${mealType}`), { date: dateStr, mealType, title: value }, { merge: true });
    } catch (err) {
      alert("Couldn't save meal: " + err.message);
    }
  };

  function renderMealAdminGrid() {
    const days = buildWeekDays(mealAdminWeekOffset);
    const today = new Date();
    document.getElementById("mealAdminWeekTitle").textContent =
      `${days[0].toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${days[6].toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;

    document.getElementById("mealAdminGrid").innerHTML = `
      <div class="meal-scroll">
      <div class="meal-grid">
        <div class="meal-headcell"></div>
        ${days.map(d => `<div class="meal-headcell ${isSameDay(d, today) ? "today" : ""}">${d.toLocaleDateString(undefined, { weekday: "short" })} ${d.getDate()}</div>`).join("")}
        ${MEAL_TYPES.map(type => `
          <div class="meal-rowlabel">${MEAL_LABELS[type]}</div>
          ${days.map(d => {
            const dateStr = isoDate(d);
            const title = findMealTitle(dateStr, type);
            return `<div class="meal-cell ${isSameDay(d, today) ? "today" : ""}"><input value="${title}" placeholder="—" style="width:100%; border:none; background:transparent; font-size:inherit; font-family:'Inter',sans-serif;" onchange="saveMealCell('${dateStr}','${type}', this.value)"></div>`;
          }).join("")}
        `).join("")}
      </div>
      </div>
    `;
  }

  window.addBlankShoppingItem = async function () {
    const draft = { text: "New item", checked: false };
    try {
      const docRef = await addDoc(shoppingCol, draft);
      openShoppingModal({ id: docRef.id, ...draft });
    } catch (err) {
      alert("Couldn't add item: " + err.message);
    }
  };

  window.toggleShoppingItem = async function (id, checked) {
    try {
      await updateDoc(doc(db, "shoppingItems", id), { checked });
    } catch (err) {
      alert("Couldn't update item: " + err.message);
    }
  };

  window.deleteShoppingItem = async function (id) {
    if (!confirm("Delete this item?")) return;
    try {
      await deleteDoc(doc(db, "shoppingItems", id));
    } catch (err) {
      alert("Couldn't delete item: " + err.message);
    }
  };

  window.saveModalShopping = async function () {
    const id = modalDraft.id;
    const text = document.getElementById("m-stext").value;
    try {
      await updateDoc(doc(db, "shoppingItems", id), { text });
      closeModal();
    } catch (err) {
      alert("Couldn't save item: " + err.message);
    }
  };

  window.openShoppingModalById = function (id) {
    const item = shoppingItemsAdmin.find(i => i.id === id);
    if (item) openShoppingModal(item);
  };

  function renderShopAdminList() {
    const sorted = [...shoppingItemsAdmin].sort((a, b) => (a.checked === b.checked ? 0 : a.checked ? 1 : -1));
    document.getElementById("shopAdminList").innerHTML = sorted.length
      ? sorted.map(item => `
          <div class="shop-item ${item.checked ? "checked" : ""}">
            <input type="checkbox" class="shop-check" ${item.checked ? "checked" : ""} onchange="toggleShoppingItem('${item.id}', this.checked)">
            <span style="flex:1; cursor:pointer;" onclick="openShoppingModalById('${item.id}')">${item.text}</span>
          </div>
        `).join("")
      : `<div style="font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); padding:10px 0;">No items yet.</div>`;
  }

  // ---------- Medicine cabinet ----------
  let medicineAdmin = [];

  onSnapshot(medicineCol, (snap) => {
    medicineAdmin = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById("medStatus").textContent = `${medicineAdmin.length} items`;
    renderMedicineTable();
    syncShoppingFromMedicine();
  });

  // Keeps the shopping list in lockstep with "Reorder now?" — runs every time
  // medicine data changes so it self-heals if anything drifts out of sync.
  function syncShoppingFromMedicine() {
    medicineAdmin.forEach(item => {
      const shopId = `med_${item.id}`;
      if (item.reorderNow) {
        const label = item.brands ? `${item.name} (${item.brands})` : item.name;
        setDoc(doc(db, "shoppingItems", shopId), { text: label, fromMedicine: true }, { merge: true }).catch(() => {});
      } else {
        deleteDoc(doc(db, "shoppingItems", shopId)).catch(() => {});
      }
    });
  }

  window.addBlankMedicine = async function () {
    const draft = { category: "", name: "New item", notes: "", brands: "", inStock: true, expirationDate: "", reorderNow: false };
    try {
      const docRef = await addDoc(medicineCol, draft);
      openMedicineModal({ id: docRef.id, ...draft });
    } catch (err) {
      alert("Couldn't add medicine: " + err.message);
    }
  };

  window.saveMedicineField = async function (id, field, value) {
    try {
      await updateDoc(doc(db, "medicineCabinet", id), { [field]: value });
    } catch (err) {
      alert("Couldn't save: " + err.message);
    }
  };

  window.deleteMedicine = async function (id) {
    if (!confirm("Delete this item?")) return;
    try {
      await deleteDoc(doc(db, "shoppingItems", `med_${id}`)).catch(() => {});
      await deleteDoc(doc(db, "medicineCabinet", id));
    } catch (err) {
      alert("Couldn't delete: " + err.message);
    }
  };

  window.saveModalMedicine = async function () {
    const id = modalDraft.id;
    const category = document.getElementById("m-mcategory").value;
    const name = document.getElementById("m-mname").value;
    const notes = document.getElementById("m-mnotes").value;
    const brands = document.getElementById("m-mbrands").value;
    const inStock = document.getElementById("m-minstock").checked;
    const expirationDate = document.getElementById("m-mexpiration").value;
    const reorderNow = document.getElementById("m-mreorder").checked;
    try {
      await updateDoc(doc(db, "medicineCabinet", id), { category, name, notes, brands, inStock, expirationDate, reorderNow });
      closeModal();
    } catch (err) {
      alert("Couldn't save medicine: " + err.message);
    }
  };

  window.openMedicineModalById = function (id) {
    const item = medicineAdmin.find(i => i.id === id);
    if (item) openMedicineModal(item);
  };

  function medExpirationClass(dateStr) {
    if (!dateStr) return "";
    const exp = new Date(dateStr + "T00:00:00");
    const today = new Date();
    const diffDays = Math.round((exp - today) / 86400000);
    if (diffDays < 0) return "med-expired";
    if (diffDays <= 60) return "med-expiring";
    return "";
  }

  function renderMedicineTable() {
    const sorted = [...medicineAdmin].sort((a, b) => (a.category || "").localeCompare(b.category || "") || a.name.localeCompare(b.name));

    const rows = [];
    let lastCategory = null;
    sorted.forEach(item => {
      const cat = item.category || "Uncategorized";
      if (cat !== lastCategory) {
        rows.push(`<tr class="med-category-row"><td colspan="7">${cat}</td></tr>`);
        lastCategory = cat;
      }
      rows.push(`
        <tr>
          <td><input type="text" value="${item.name}" onchange="saveMedicineField('${item.id}','name', this.value)"></td>
          <td><input type="text" value="${item.notes || ""}" onchange="saveMedicineField('${item.id}','notes', this.value)"></td>
          <td><input type="text" value="${item.brands || ""}" onchange="saveMedicineField('${item.id}','brands', this.value)"></td>
          <td style="text-align:center;"><input type="checkbox" class="med-check" ${item.inStock ? "checked" : ""} onchange="saveMedicineField('${item.id}','inStock', this.checked)"></td>
          <td class="${medExpirationClass(item.expirationDate)}"><input type="date" value="${item.expirationDate || ""}" onchange="saveMedicineField('${item.id}','expirationDate', this.value)"></td>
          <td class="med-reorder-cell ${item.reorderNow ? "active" : ""}" style="text-align:center;"><input type="checkbox" class="med-check" ${item.reorderNow ? "checked" : ""} onchange="saveMedicineField('${item.id}','reorderNow', this.checked); this.closest('td').classList.toggle('active', this.checked)"></td>
          <td><button class="med-del-btn" onclick="deleteMedicine('${item.id}')" title="Delete">✕</button></td>
        </tr>
      `);
    });

    document.getElementById("medAdminTable").innerHTML = `
      <div class="med-scroll">
        <table class="med-table">
          <thead>
            <tr>
              <th>Active Ingredient</th><th>Notes</th><th>Brand(s)</th><th>In Stock?</th><th>Expiration</th><th>Reorder?</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${rows.join("") || '<tr><td colspan="7" style="padding:14px 6px; color:var(--ink-soft); font-family:\'IBM Plex Mono\',monospace; font-size:13px;">No items yet.</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  }
</script>
</body>
</html>
